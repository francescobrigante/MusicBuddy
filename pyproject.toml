[project]
name = "musicbuddy"
version = "0.1.0"
description = "MusicBuddy: a real-time AI accompanist that listens to your MIDI instrument and plays chords with you"
authors = [
    { name = "Francesco Brigante", email = "francescobrigantefb@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.12"

# Core = what the real-time accompanist needs (LSTM inference, MIDI I/O, FluidSynth playback).
# FluidSynth itself is a system library: see the README.
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "pyfluidsynth>=1.3.3",
]

[project.optional-dependencies]
# Training: dataset preprocessing (data_processing.py) and the LSTM training loop.
train = [
    "pandas>=2.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[tool.uv]
# The repository is run from its root (python main.py), not installed as a package.
package = false
